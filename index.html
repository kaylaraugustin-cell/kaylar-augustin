
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog Michael</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background-color: #6b46c1;
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .artigo-autor {
            font-weight: bold;
            color: #666;
        }

        
        .button-curtir {
            background-color: #fce8e6;
            color: #d93025;
            border: 2px solid #f28b82;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 15px;
        }

        .btn-curtir:hover {
            background-color: #fad2cf;
        }

        .btn-curtir:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos
            sobre Michael Jackson.</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="Michael Jackson o rei do POP">

        <h2>Meu primeiro post</h2>

        <p class="artigo-autor">Por: Kaylar Augustin</p>

        <p>
            Boas-vindas ao meu novo blog! 
            Aqui vou falar sobre meu artista
            favorito,Michael Jackson,que é
            afro-americano e o Rei do Pop.
        </p>
        <button class="button-curtir">❤️ <span>0</span></button>
    </main>
    </script>
</body>
</html>
